<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>先知命局 · Design System Demo</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <style>
      body { margin: 0; padding: 32px; color: var(--ds-color-text-primary); background: var(--ds-color-background); font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .demo { max-width: 1080px; margin: 0 auto; }
      .demo-section { margin-top: 28px; }
      .demo-section h2 { margin: 0 0 12px; font-size: 17px; }
      .demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .demo-card-copy { color: var(--ds-color-text-secondary); font-size: 12px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main class="demo">
      <div id="pageHeader"></div>
      <section class="demo-section">
        <h2>按钮</h2>
        <div id="buttons" class="demo-row"></div>
      </section>
      <section class="demo-section">
        <h2>状态</h2>
        <div class="demo-row">
          <span class="ds-badge ds-badge--neutral">未开始</span>
          <span class="ds-badge ds-badge--info">进行中</span>
          <span class="ds-badge ds-badge--success">已完成</span>
          <span class="ds-badge ds-badge--warning">待处理</span>
          <span class="ds-badge ds-badge--danger">异常</span>
        </div>
      </section>
      <section class="demo-section">
        <h2>指标卡</h2>
        <div id="metrics" class="ds-grid ds-grid--4"></div>
      </section>
      <section class="demo-section">
        <h2>卡片</h2>
        <div class="ds-card"><div class="ds-card__header"><h3 class="ds-section-title__heading">通用内容卡片</h3></div><div class="ds-card__body"><p class="demo-card-copy">卡片支持 header、body、footer 三段式结构，页面可以按需组合。</p></div><div class="ds-card__footer"><button class="ds-button ds-button--ghost ds-button--sm">查看详情</button></div></div>
      </section>
    </main>
    <script src="components.js"></script>
    <script>
      const icon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg>';
      document.querySelector('#pageHeader').innerHTML = DesignSystem.pageHeader({ title: '组件库示例', subtitle: '运营总览设计语言的可复用实现', actions: DesignSystem.button({ label: '主要操作', variant: 'primary' }) });
      document.querySelector('#buttons').innerHTML = [
        DesignSystem.button({ label: '默认', variant: 'default' }),
        DesignSystem.button({ label: '主要', variant: 'primary' }),
        DesignSystem.button({ label: '次要', variant: 'secondary' }),
        DesignSystem.button({ label: '描边', variant: 'outline' }),
        DesignSystem.button({ label: '危险', variant: 'danger' }),
        DesignSystem.button({ icon, size: 'icon', attributes: { 'aria-label': '图标操作' } })
      ].join('');
      document.querySelector('#metrics').innerHTML = [
        ['今日成交额', '¥128,640', 'blue'],
        ['付费订单数', '326', 'green'],
        ['新增会员数', '48', 'violet'],
        ['在线导师数', '76', 'orange']
      ].map(([label, value, tone]) => DesignSystem.metricCard({ label, value, tone, icon, note: '较昨日 +12.8%', sparkline: [30, 56, 42, 82, 66] })).join('');
    </script>
  </body>
</html>
