:root {
  --paper: #f5f5f1;
  --ink: #20211f;
  --muted: #7d7e79;
  --line: #d7d7d0;
  --panel: rgba(246, 246, 242, 0.92);
  --ease: cubic-bezier(0.2, 0.75, 0.2, 1);
}

* { box-sizing: border-box; }

html { min-width: 320px; background: var(--paper); }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  color: var(--ink);
  background: #cfe5f5;
  font-family: "Hepta Slab", Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.01em;
}

.site-shell {
  position: relative;
  width: min(1320px, calc(100vw - 96px));
  margin: 32px auto;
  overflow: hidden;
  background: var(--paper);
  border-radius: 4px;
  box-shadow: 0 18px 42px rgba(28, 41, 51, 0.17);
}

button, a { color: inherit; font: inherit; }
button { border: 0; background: none; cursor: pointer; }
a { text-decoration: none; }

.header {
  position: relative;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: 78px;
  padding: 20px 38px 12px;
}

.wordmark {
  justify-self: start;
  font-size: 19px;
  font-style: italic;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.main-nav {
  display: flex;
  align-items: center;
  gap: 34px;
}

.nav-item {
  position: relative;
  padding: 6px 0;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
  transition: color 180ms ease;
}

.nav-item:hover, .nav-item.active { color: var(--ink); }
.nav-item span { margin-left: 4px; color: #a6a7a1; }

.motion-button {
  justify-self: end;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 6px 0;
  color: var(--muted);
  font-size: 10px;
}

.motion-icon {
  display: inline-grid;
  place-items: center;
  width: 15px;
  height: 15px;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-family: Arial, sans-serif;
  font-size: 7px;
  line-height: 1;
}

.stage {
  position: relative;
  height: min(510px, calc(100vh - 180px));
  min-height: 440px;
  isolation: isolate;
  overflow: hidden;
}

.visual-rail {
  position: absolute;
  inset: 0 auto 0 50%;
  z-index: 1;
  width: min(92vw, 1240px);
  min-width: 920px;
  container-type: inline-size;
  transform: translateX(calc(-50% + var(--rail-shift, 0px)));
}

/* Compact rail (like the recording): garments hang almost shoulder to shoulder,
   the rod is just long enough to make room for one garment turned to the front. */
.rail-bar-image {
  position: absolute;
  top: calc(76px - 12.74cqw); /* rod top = inside of the hook crest */
  left: 14cqw;
  width: 72cqw;
  max-width: none;
  pointer-events: none;
  filter: drop-shadow(0 6px 5px rgba(40, 42, 38, 0.10));
  animation: rod-in 1100ms var(--ease) 120ms both;
}

@keyframes rod-in {
  from { clip-path: inset(0 50% 0 50%); opacity: 0; }
  30% { opacity: 1; }
  to { clip-path: inset(0 0 0 0); opacity: 1; }
}

.hanger-row {
  position: absolute;
  inset: 0;
}

.rail-photo {
  position: absolute;
  top: calc(76px - 5.1cqw);
  left: calc(27.6cqw + var(--index) * 5.6cqw);
  width: 5.6cqw;
  height: 35cqw;
  padding: 0;
  cursor: pointer;
  transition: opacity 260ms ease;
}

/* the hovered garment faces you and is much wider: keep the whole of it hoverable */
.rail-photo.is-hover::after {
  content: "";
  position: absolute;
  inset: 4cqw -6.3cqw 0;
}

.rail-photo img {
  position: absolute;
  top: 0;
  left: 50%;
  display: block;
  width: 23.9cqw;
  max-width: none;
  height: auto;
  transform: translateX(-50%);
  transform-origin: 49% 12.6%;
  pointer-events: none;
  will-change: transform, opacity;
  backface-visibility: hidden;
}

.rail-photo img.turn-view { opacity: 0; }

.rail-photo:focus-visible {
  outline: none;
}

.is-detail .visual-rail {
  opacity: 0.13;
  filter: blur(2px);
  transform: translateX(calc(-50% + var(--rail-shift, 0px))) translateY(4%) scale(1.18);
  pointer-events: none;
}

.visual-rail { transition: transform var(--fade, 250ms) ease, opacity var(--fade, 250ms) ease, filter var(--fade, 250ms) ease; }

/* close-up garment: cross-fades in with the close-up; on switching it is cut and fades back in */
.detail-garment {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--fade, 250ms) ease;
}

.is-detail .detail-garment { opacity: 1; }
.detail-garment.is-cut { opacity: 0 !important; transition: none !important; }

.detail-garment img {
  display: block;
  width: 100%;
  height: auto;
  transform-origin: 49% 12.6%;
  user-select: none;
}

.is-detail .rack { pointer-events: auto; cursor: zoom-out; }

.rack {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}

.rack canvas {
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
}

.stage-loading {
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  color: var(--muted);
  font-size: 10px;
  pointer-events: none;
  transition: opacity 240ms ease;
}

.stage-loading[hidden] { opacity: 0; }

.stage-arrow {
  position: absolute;
  top: 50%;
  z-index: 3;
  width: 42px;
  height: 42px;
  transform: translateY(-50%);
  color: #8d8e88;
  font-family: Arial, sans-serif;
  font-size: 30px;
  line-height: 1;
  opacity: 0;
  transition: opacity 180ms ease, color 180ms ease;
}

.stage:hover .stage-arrow, .stage-arrow:focus-visible { opacity: 1; }
.is-detail .stage-arrow { opacity: 0 !important; pointer-events: none; }
.stage-arrow:hover { color: var(--ink); }
.stage-arrow-left { left: 18px; }
.stage-arrow-right { right: 18px; }

/* ---------- close-up layer ---------- */
.detail-ui {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  visibility: hidden;
  transition: visibility 0s linear var(--fade, 250ms);
}

.is-detail .detail-ui { visibility: visible; transition-delay: 0s; }
.detail-ui > * { opacity: 0; transition: opacity var(--fade, 250ms) ease; }
.is-detail .detail-ui > * { opacity: 1; pointer-events: auto; }

    <script>
(() => {

/*
 * Clothing rail — every garment is a real photo, so the piece in the close-up
 * is always the exact garment that was clicked.
 *
 * sideImage  – the garment on its hanger seen from the side (rail view)
 * frontImage – the same garment on its hanger seen from the front. Lined up with
 *              the side photo by tools/align_front.py (same hook point, same length).
 *
 * Timing follows the reference recording (24 fps, measured frame by frame):
 *   hover  – the garment turns side → front in ≈0.2 s while its neighbours slide
 *            apart; once it faces you it sways gently. The garment you leave
 *            turns back to the side and swings on its hook.
 *   click  – the rail cross-fades to the close-up in ≈0.25 s.
 *   arrows – the current garment disappears at once and the next fades in (≈0.25 s).
 */
const garments = [
  { name: "Peach Knit Polo", swatch: "#edb8c0", sideImage: "public/assets/rail/peach.png", frontImage: "public/assets/rail/peach-front.png" },
  { name: "Brown Knit Polo", swatch: "#ae9782", sideImage: "public/assets/rail/brown.png", frontImage: "public/assets/rail/brown-front.png" },
  { name: "Blue Knit Polo", swatch: "#5a9cdd", sideImage: "public/assets/rail/blue.png", frontImage: "public/assets/rail/blue-front.png" },
  { name: "Yellow Knit Polo", swatch: "#f2df9a", sideImage: "public/assets/rail/yellow.png", frontImage: "public/assets/rail/yellow-front.png" },
  { name: "Ivory Knit Sweater", swatch: "#e8e6de", sideImage: "public/assets/rail/white.png", frontImage: "public/assets/rail/white-front.png" },
  { name: "Pale Knit Cardigan", swatch: "#e8e6ab", sideImage: "public/assets/rail/pale.png", frontImage: "public/assets/rail/pale-front.png" },
  { name: "Apricot Knit Cardigan", swatch: "#edbb8f", sideImage: "public/assets/rail/orange.png", frontImage: "public/assets/rail/orange-front.png" },
  { name: "Gray Knit Sweater", swatch: "#9f9fa1", sideImage: "public/assets/rail/gray.png", frontImage: "public/assets/rail/gray-front.png" },
];

// Where the hook and hem sit inside every photo (measured from the PNGs).
const HOOK_X = 0.49;
const HOOK_Y = 0.126;
const GARMENT_SPAN = 0.714; // hook top → hem, fraction of photo height
const SIDE_HALF = 0.135; // half-width of a side view, fraction of photo width
const FRONT_HALF = 0.38; // half-width of a front view, fraction of photo width

// Motion (seconds / degrees)
const TURN_TIME = 0.22; // side → front (reaches the front in ≈0.2 s, then overshoots a little)
const TURN_STIFFNESS = 210; // turn spring: higher = snappier
const TURN_DAMPING = 15; // lower = more bounce past the front before settling (≈10°)
const TURN_ANGLE = 82; // each photo's share of the rotation
const HOVER_SWAY = 1.2; // gentle swing once the hovered garment faces you
const RELEASE_SWING = 1.1; // rad/s kick a garment gets when it is let go
const CLOSE_SWAY = 2.4; // swing in the close-up (0 = still)
// "twist": the garment's left and right edges moving forward/back (rotation around the hook's vertical axis)
const IDLE_TWIST = 2.5; // garments at rest on the rail
const HOVER_TWIST = 7; // the garment facing you
const CLOSE_TWIST = 8; // close-up
const FADE_TIME = 250; // ms: rail ↔ close-up cross-fade, garment fade-in when switching

const $ = (selector) => document.querySelector(selector);
const shell = $("#shell");
const stage = $("#stage");
const visualRail = $("#visualRail");
const announcer = $("#announcer");
const detailGarment = $("#detailGarment");
const detailImage = detailGarment.querySelector("img");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const DEG = Math.PI / 180;

const items = [];
let hovered = -1;
let selected = -1;
let focusIndex = 0;
let moving = !reducedMotion.matches;
let clock = 0;
let lastFrame = performance.now();
let ready = false;
let swipe = null;
const close = { sway: 0, v_sway: 0 };

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = (n) => String(n).padStart(2, "0");
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function spring(state, key, target, stiffness, damping, dt) {
  const v = `v_${key}`;
  const velocity = state[v] || 0;
  state[v] = velocity + ((target - state[key]) * stiffness - velocity * damping) * dt;
  state[key] += state[v] * dt;
}

/* ---------- side → front turn ---------- */

// The side photo swings away around the hook while the front photo swings in;
// they hand over when the garment is edge-on.
function applyTurn(item, base) {
  const p = item.t; // may overshoot past 1 (bounce) or 0
  const q = clamp(p, 0, 1);
  const squash = (1 - Math.sin(q * Math.PI) * 0.06).toFixed(4);
  const mix = smooth(0.38, 0.62, q);
  const twist = item.twist || 0;
  item.image.style.transform = `${base} rotateY(${(p * TURN_ANGLE + twist).toFixed(2)}deg) scaleX(${squash})`;
  item.front.style.transform = `${base} rotateY(${(-(1 - p) * TURN_ANGLE + twist).toFixed(2)}deg) scaleX(${squash})`;
  item.image.style.opacity = (1 - mix).toFixed(3);
  item.front.style.opacity = mix.toFixed(3);
}

/* ---------- layout ---------- */

function slotWidth() {
  return items[0]?.button.getBoundingClientRect().width || 70;
}

function updateRailPan() {
  const shift = stage.clientWidth <= 800 ? ((garments.length - 1) / 2 - focusIndex) * slotWidth() : 0;
  visualRail.style.setProperty("--rail-shift", `${shift}px`);
}

// The hovered garment needs room to face you: everything to its left slides
// left, everything to its right slides right, by just enough.
function railOffset(index) {
  if (hovered < 0 || selected >= 0 || index === hovered) return 0;
  const imgW = items[hovered].image.offsetWidth;
  const push = Math.max(0, imgW * (FRONT_HALF + SIDE_HALF + 0.01) - slotWidth());
  return index < hovered ? -push : push;
}

function placeCloseUp() {
  const s = shell.getBoundingClientRect();
  const narrow = s.width < 800;
  const span = s.height * (narrow ? 0.44 : 0.53);
  const h = span / GARMENT_SPAN;
  const w = h * 1122 / 1402;
  detailGarment.style.width = `${w}px`;
  detailGarment.style.left = `${s.width / 2 - w * HOOK_X}px`;
  detailGarment.style.top = `${s.height * (narrow ? 0.12 : 0.16) - h * HOOK_Y}px`;
}

/* ---------- captions ---------- */

function updateCaption() {
  const active = selected >= 0 ? selected : hovered >= 0 ? hovered : focusIndex;
  $("#productLabel").textContent = hovered >= 0 || selected >= 0 ? garments[active].name : "The full collection";
  $("#productHint").textContent = hovered >= 0 ? "Click to take a closer look" : "Hover a piece. Click to look closer.";
  $("#indexLabel").textContent = pad(active + 1);
  document.querySelectorAll(".dot").forEach((dot, index) => dot.classList.toggle("current", index === active));
  updateRailPan();
}

function setHovered(index) {
  if (!ready || selected >= 0 || hovered === index) return;
  const previous = hovered;
  hovered = index;
  if (previous >= 0) items[previous].released = true;
  if (index >= 0) {
    focusIndex = index;
    items[index].hoverAt = clock;
    items[index].released = false;
  }
  items.forEach((item, i) => item.button.classList.toggle("is-hover", i === index));
  updateCaption();
}

/* ---------- close-up ---------- */

function showInCloseUp(index, fadeIn) {
  const g = garments[index];
  detailImage.src = g.frontImage;
  detailImage.alt = g.name;
  $("#detailKicker").textContent = `${pad(index + 1)} / ${pad(garments.length)}`;
  $("#detailName").textContent = g.name;
  if (fadeIn) {
    // as in the recording: the old garment is gone at once, the new one fades in
    detailGarment.classList.add("is-cut");
    void detailGarment.offsetWidth;
    detailGarment.classList.remove("is-cut");
  }
  close.sway = 0;
  close.v_sway = 0;
  close.twist = 0;
  close.v_twist = 0;
}

function selectProduct(index) {
  if (!ready || selected === index) return;
  const switching = selected >= 0;
  if (!switching) setHovered(-1);
  selected = index;
  focusIndex = index;
  placeCloseUp();
  showInCloseUp(index, switching);
  shell.classList.add("is-detail");
  $("#detailUi").setAttribute("aria-hidden", "false");
  updateCaption();
  announcer.textContent = `${garments[index].name} selected.`;
}

function closeProduct() {
  if (selected < 0) return;
  focusIndex = selected;
  selected = -1;
  shell.classList.remove("is-detail");
  $("#detailUi").setAttribute("aria-hidden", "true");
  updateCaption();
}

function browse(direction) {
  const next = ((selected >= 0 ? selected : focusIndex) + direction + garments.length) % garments.length;
  if (selected >= 0) selectProduct(next);
  else setHovered(next);
}

function updateMotionButton() {
  $("#motionButton").setAttribute("aria-pressed", String(moving));
  $("#motionButton").setAttribute("aria-label", moving ? "Pause garment motion" : "Resume garment motion");
  $(".motion-icon").textContent = moving ? "Ⅱ" : "▶";
  $(".motion-label").textContent = moving ? "Motion on" : "Motion off";
}

/* ---------- animation loop ---------- */

function animateRail(dt) {
  items.forEach((item, index) => {
    const isHover = index === hovered && selected < 0;
    if (!item.landed) {
      if (clock < item.enterAt) { item.button.style.opacity = "0"; return; }
      item.landed = true;
      item.button.style.opacity = "";
      item.v_rot = (index % 2 ? 1 : -1) * 1.6;
    }

    const targetX = railOffset(index);
    const before = item.x;
    if (reducedMotion.matches) {
      item.x = targetX; item.t = isHover ? 1 : 0; item.y = 0; item.rot = 0; item.twist = 0;
    } else {
      // neighbours slide apart in step with the turn (≈0.25 s, no bounce)
      spring(item, "x", targetX, 260, 32, dt);
      spring(item, "y", 0, 120, 11, dt);
      // the turn is a slightly under-damped spring: it gets there fast, swings a
      // little past the front (or the side), then settles — like a real hanger
      spring(item, "t", isHover ? 1 : 0, TURN_STIFFNESS, TURN_DAMPING, dt);
      item.t = clamp(item.t, -0.2, 1.2);

      // 1) turn to face you, 2) only then start to sway
      let swayTarget = 0;
      if (isHover && moving) {
        swayTarget = Math.sin((clock - item.hoverAt - TURN_TIME) * 2.2) * HOVER_SWAY * DEG * smooth(0.9, 1, item.t);
      }
      // the garment you leave turns back and swings on its hook
      if (item.released) {
        item.released = false;
        item.v_rot = (item.v_rot || 0) + (hovered >= 0 && index > hovered ? 1 : -1) * RELEASE_SWING;
      }
      const vx = (item.x - before) / Math.max(dt, 0.001);
      item.v_rot = (item.v_rot || 0) - (vx - (item.lastVx || 0)) * 0.0006;
      item.lastVx = vx;
      spring(item, "rot", swayTarget, 34, 2.6, dt);
      item.rot = clamp(item.rot, -0.2, 0.2);

      // twist: edges moving forward/back. It runs a quarter-cycle behind the
      // side-to-side swing, so together they read as a 3D pendulum. The turn's
      // momentum and any push along the rod feed into it as well.
      const facing = isHover ? smooth(0.85, 1, item.t) : 0;
      const amp = moving ? IDLE_TWIST + (HOVER_TWIST - IDLE_TWIST) * facing : 0;
      const phase = isHover ? (clock - item.hoverAt) * 2.2 : clock * 1.05 + index * 1.3;
      const twistTarget = amp * Math.cos(phase) + (item.v_t || 0) * -2.2 + (item.v_rot || 0) * 9;
      spring(item, "twist", twistTarget, 40, 7, dt);
      item.twist = clamp(item.twist, -16, 16);
    }

    item.button.style.transform = `translate3d(${item.x.toFixed(2)}px, ${item.y.toFixed(2)}px, 0)`;
    // overlap order as in the recording: each garment sits in front of the one to its right
    item.button.style.zIndex = String(isHover ? 100 : (item.t > 0.02 ? 50 : 10) + (items.length - index));
    applyTurn(item, `translateX(-50%) perspective(900px) rotate(${item.rot.toFixed(4)}rad)`);
  });
}

function animateCloseUp(dt) {
  if (selected < 0 || reducedMotion.matches) { detailImage.style.transform = ""; return; }
  const target = moving ? Math.sin(clock * 1.9) * CLOSE_SWAY * DEG : 0;
  spring(close, "sway", target, 30, 3.5, dt);
  const twist = moving ? Math.cos(clock * 1.9) * CLOSE_TWIST : 0;
  spring(close, "twist", twist, 40, 7, dt);
  detailImage.style.transform = `perspective(1200px) rotate(${close.sway.toFixed(4)}rad) rotateY(${(close.twist || 0).toFixed(2)}deg)`;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  if (!document.hidden) clock += dt;
  if (!ready) return;
  const steps = Math.ceil(dt / 0.012);
  for (let i = 0; i < steps; i++) animateRail(dt / steps);
  animateCloseUp(dt);
}

/* ---------- events ---------- */

$("#motionButton").addEventListener("click", () => { moving = !moving; updateMotionButton(); });
$("#prevButton").addEventListener("click", () => browse(-1));
$("#nextButton").addEventListener("click", () => browse(1));
$("#detailPrev").addEventListener("click", () => browse(-1));
$("#detailNext").addEventListener("click", () => browse(1));
$("#returnButton").addEventListener("click", closeProduct);
$("#collectionButton").addEventListener("click", closeProduct);
window.addEventListener("resize", () => { updateRailPan(); if (selected >= 0) placeCloseUp(); });
window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeProduct();
  if (event.target.closest?.("a")) return;
  if (event.key === "ArrowLeft") browse(-1);
  if (event.key === "ArrowRight") browse(1);
});
reducedMotion.addEventListener?.("change", (event) => {
  if (event.matches) { moving = false; updateMotionButton(); }
});
stage.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "mouse" || selected >= 0) return;
  swipe = { x: event.clientX };
});
stage.addEventListener("pointerup", (event) => {
  if (!swipe) return;
  const dx = event.clientX - swipe.x;
  swipe = null;
  if (Math.abs(dx) > 40) browse(dx < 0 ? 1 : -1);
});
$("#rack").addEventListener("click", (event) => { if (event.target.id === "rack") closeProduct(); });

/* ---------- build ---------- */

garments.forEach((item, index) => {
  const photo = document.createElement("button");
  photo.className = "rail-photo";
  photo.type = "button";
  photo.style.setProperty("--index", index);
  photo.setAttribute("aria-label", `Select ${item.name}`);
  const image = document.createElement("img");
  image.src = item.sideImage;
  image.alt = "";
  image.decoding = "async";
  image.draggable = false;
  const front = image.cloneNode();
  front.src = item.frontImage;
  front.className = "turn-view";
  photo.append(image, front);
  photo.addEventListener("mouseenter", () => setHovered(index));
  photo.addEventListener("mouseleave", () => setHovered(-1));
  photo.addEventListener("focus", () => setHovered(index));
  photo.addEventListener("blur", () => setHovered(-1));
  photo.addEventListener("click", () => selectProduct(index));
  $("#hangerRow").append(photo);
  items.push({
    button: photo, image, front,
    x: 0, y: -60, t: 0, twist: 0, rot: 0, landed: false, hoverAt: 0, released: false,
    enterAt: 0.55 + index * 0.07,
  });

  const dot = document.createElement("button");
  dot.className = "dot";
  dot.type = "button";
  dot.setAttribute("aria-label", `Select ${item.name}`);
  dot.style.setProperty("--swatch", item.swatch);
  dot.innerHTML = "<i></i>";
  dot.addEventListener("click", () => selectProduct(index));
  $("#productDots").append(dot);
});

$("#collectionCount").textContent = pad(garments.length);
$("#collectionTotal").textContent = pad(garments.length);
shell.style.setProperty("--fade", `${FADE_TIME}ms`);
updateCaption();
updateMotionButton();
requestAnimationFrame(frame);

Promise.all(items.flatMap(({ image, front }) => [image, front].map((el) => el.decode().catch(() => {})))).then(() => {
  $("#loading").hidden = true;
  clock = 0;
  lastFrame = performance.now();
  ready = true;
  requestAnimationFrame(() => shell.classList.remove("is-loading"));
});

})();
</script>
  </body>
</html>
